name: Verify sprite atlas
on: [push, pull_request]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: go vet ./...
      - run: python -m pip install Pillow==13.0.0
      - run: python -m unittest -v
